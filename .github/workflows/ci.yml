name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# NB: no `cargo fmt --check`. The checked-in style predates rustfmt 1.9's
# stricter defaults and running fmt churns every file (see AGENTS.md and the
# repo history). Style is matched by hand.
#
# NB: no `harmonic_synth` job. The plugin moved to a private repo
# (Gnomir/cosine-synth-private) — its own CI lives there now, not here.

jobs:
  core:
    name: harmonic_core · test + lint + wasm + bare-metal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harmonic_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: >-
            wasm32-unknown-unknown,
            thumbv7em-none-eabihf,
            thumbv6m-none-eabi,
            riscv32imac-unknown-none-elf,
            aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harmonic_core

      - name: test (std)
        run: cargo test

      - name: clippy (std)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (no_std, release)
        run: cargo clippy --no-default-features --release -- -D warnings

      - name: build (real no_std)
        run: cargo build --no-default-features --release

      - name: wasm32 build + bit-exact cross-check
        run: |
          cargo build --no-default-features --release --target wasm32-unknown-unknown
          node scripts/verify-wasm.mjs

      - name: bare-metal compile-check
        run: |
          for t in thumbv7em-none-eabihf thumbv6m-none-eabi \
                   riscv32imac-unknown-none-elf aarch64-unknown-none; do
            echo "::group::$t"
            cargo build --no-default-features --release --target "$t"
            echo "::endgroup::"
          done

  core-simd:
    name: harmonic_core · nightly portable-simd
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harmonic_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harmonic_core
      - name: clippy (portable-simd)
        run: cargo clippy --no-default-features --release --features portable-simd -- -D warnings
      - name: build (portable-simd)
        run: cargo build --no-default-features --release --features portable-simd

  webapp:
    name: webapp · test + smoke boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: npm ci
        run: npm ci

      - name: syntax-check every source file
        run: |
          find src test test-support -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: test (AUDIT.md M-5)
        run: npm test

      - name: smoke boot
        env:
          NODE_ENV: production
          SESSION_SECRET: ${{ github.run_id }}-ci-smoke-boot-secret-not-for-real-use
          PORT: 4000
        run: |
          npm start &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4000/healthz; then echo; exit 0; fi
            sleep 0.5
          done
          echo "server never became healthy" >&2
          exit 1

  cross-verify:
    name: harmonic_core · bit-exact on emulated ARM (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: register QEMU / binfmt for arm64 + arm
        run: docker run --rm --privileged tonistiigi/binfmt --install arm64,arm
      - name: cross-verify.sh
        working-directory: harmonic_core
        run: bash scripts/cross-verify.sh
